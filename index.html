<!DOCTYPE html>
<html lang="id" class="dark overflow-x-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>MailMX - Platform Stor Gmail Enterprise</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        },
                        surface: {
                            base: '#080d1a',
                            card: '#0f172a',
                            border: 'rgba(255, 255, 255, 0.08)',
                            hover: '#162032'
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.25s ease-out forwards',
                        'slide-up': 'slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* New modern visual system using CSS variables to keep colors consistent */
        :root{
            --bg-900: #060a12;
            --bg-800: #0b1320;
            --card: rgba(12,18,30,0.65);
            --card-strong: rgba(10,14,24,0.84);
            --muted: #94a3b8;
            --text: #e6eef8;
            --accent: #3b82f6; /* blue */
            --accent-2: #7c3aed; /* purple */
            --success: #10b981;
            --danger: #ef4444;
        }

        html,body{height:100%;}
        body { 
            background-color: var(--bg-900); 
            color: var(--text); 
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
            -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
            background-image: radial-gradient(circle at 10% 10%, rgba(59,130,246,0.08) 0px, transparent 25%),
                              radial-gradient(circle at 90% 90%, rgba(124,58,237,0.06) 0px, transparent 25%),
                              linear-gradient(180deg, rgba(255,255,255,0.015), rgba(0,0,0,0.02));
            background-attachment: fixed;
        }
        /* Panels / cards */
        .panel-card { 
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            background-color: var(--card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 8px 30px rgba(2, 6, 23, 0.6);
        }

        .panel-card-hover { 
            transition: transform 240ms cubic-bezier(.16,1,.3,1), box-shadow 240ms, border-color 240ms;
        }
        .panel-card-hover:hover {
            transform: translateY(-6px);
            border-color: rgba(59,130,246,0.22);
            box-shadow: 0 18px 40px rgba(2,6,23,0.7), 0 6px 18px rgba(59,130,246,0.04);
        }

        /* Forms and inputs */
        .form-input {
            background: rgba(15, 23, 42, 0.45);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 0.75rem 1rem;
            border-radius: 12px;
            color: var(--text);
            transition: box-shadow .18s ease, border-color .18s ease, transform .12s ease;
        }
        .form-input::placeholder { color: rgba(226,238,248,0.35); }
        .form-input:focus {
            outline: none;
            border-color: rgba(59,130,246,0.9);
            box-shadow: 0 6px 30px rgba(59,130,246,0.08);
            transform: translateY(-1px);
            background: rgba(8,12,20,0.88);
        }

        /* Buttons: keep existing class usage but add neat defaults */
        button { cursor: pointer; }
        .btn-primary {
            background: linear-gradient(90deg, var(--accent), #6366f1);
            color: #061226; font-weight: 700; border-radius: 12px; padding: .625rem 1rem; box-shadow: 0 8px 28px rgba(59,130,246,0.12);
        }
        .btn-ghost {
            background: transparent; border: 1px solid rgba(255,255,255,0.04); color: var(--text); padding: .5rem .9rem; border-radius: 10px;
        }

        /* Navbar tweaks */
        nav { backdrop-filter: blur(6px); }
        .nav-tab { transition: all .18s ease; }

        /* scrollbars */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scrollbar::-webkit-scrollbar { height: 7px; width: 7px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(12,18,30,0.35); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.18); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(99,102,241,0.3); }

        /* Toasts */
        #toast-container { position: fixed; bottom: 22px; right: 22px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast-item { pointer-events: auto; animation: slideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; border-radius: 12px; }

        /* Utility */
        .hidden-auth { display: none !important; }

        /* Subtle ambient glows (keeps original elements but a bit softer) */
        .ambient-glow { filter: blur(100px); opacity: .7; }

        /* Responsive improvements */
        @media (max-width: 640px) {
            .panel-card { border-radius: 14px; }
            .btn-primary { padding: .6rem .85rem; }
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col selection:bg-blue-500/30 selection:text-blue-200">

    <!-- AMBIENT BACKGROUND GLOW -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
        <div class="absolute top-[-12%] left-[-12%] w-[48%] h-[48%] rounded-full bg-gradient-to-tr from-blue-600/12 to-transparent ambient-glow"></div>
        <div class="absolute bottom-[-12%] right-[-12%] w-[48%] h-[48%] rounded-full bg-gradient-to-bl from-purple-600/10 to-transparent ambient-glow"></div>
    </div>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="px-4 sm:px-0"></div>

    <!-- NAVBAR -->
    <nav class="sticky top-0 z-50 bg-[#060a12]/80 backdrop-blur-xl border-b border-white/8 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            
            <!-- Logo -->
            <div class="flex items-center space-x-3 shrink-0 cursor-pointer group" onclick="switchTab('dashboard')">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-lg text-white shadow-lg shadow-blue-500/22 ring-1 ring-white/3">
                    <i class="fa-solid fa-envelope-open-text"></i>
                </div>
                <div class="flex flex-col">
                    <span class="text-lg font-extrabold tracking-tight text-white leading-tight">MailMX</span>
                    <span class="text-[10px] text-blue-300 font-bold tracking-widest uppercase">Platform stor gmail</span>
                </div>
            </div>

            <!-- rest unchanged (IDs/classes preserved) -->
            <div id="nav-links" class="hidden-auth hidden md:flex items-center space-x-1 py-1 px-1.5 bg-slate-900/90 border border-white/10 rounded-2xl shadow-inner">
                <button onclick="switchTab('dashboard')" id="nav-btn-dashboard" class="nav-tab px-4 py-2 rounded-xl text-xs font-semibold transition-all whitespace-nowrap flex items-center space-x-2 text-slate-400 hover:text-white hover:bg-white/5">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i><span>Dashboard</span>
                </button>
                <button onclick="switchTab('stor')" id="nav-btn-stor" class="nav-tab px-4 py-2 rounded-xl text-xs font-semibold transition-all whitespace-nowrap flex items-center space-x-2 text-slate-400 hover:text-white hover:bg-white/5">
                    <i data-lucide="send" class="w-4 h-4"></i><span>Stor Gmail</span>
                </button>
                <button onclick="switchTab('harga')" id="nav-btn-harga" class="nav-tab px-4 py-2 rounded-xl text-xs font-semibold transition-all whitespace-nowrap flex items-center space-x-2 text-slate-400 hover:text-white hover:bg-white/5">
                    <i data-lucide="tag" class="w-4 h-4"></i><span>Harga</span>
                </button>
                <button onclick="switchTab('referral')" id="nav-btn-referral" class="nav-tab px-4 py-2 rounded-xl text-xs font-semibold transition-all whitespace-nowrap flex items-center space-x-2 text-slate-400 hover:text-white hover:bg-white/5">
                    <i data-lucide="users" class="w-4 h-4"></i><span>Referral</span>
                </button>
            </div>

            <div id="auth-btn-container" class="shrink-0">
                <button onclick="switchTab('login')" class="px-5 py-2.5 text-xs font-bold text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 rounded-xl shadow-sm">
                    <i class="fa-solid fa-right-to-bracket"></i> Masuk
                </button>
            </div>
        </div>
    </nav>

    <!-- rest of page intentionally unchanged to preserve functionality -->

</body>
</html>
